<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Disputes</title><link rel="stylesheet" href="platform.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="orders.html">Orders</a><a href="dashboard.html">Dashboard</a></nav></header>
<main class="wrap"><section class="hero"><h1>Dispute resolution</h1><p class="muted">Raise issues, attach evidence, and track resolution status.</p></section><form id="disputeForm" class="stack"><label>Title<input name="title" required></label><label>Order ID<input name="orderId"></label><label>Reason<textarea name="reason" required></textarea></label><label>Evidence URL<input name="evidenceUrl"></label><button>Raise dispute</button><p data-status class="status"></p></form><section id="disputesList" class="grid" style="margin-top:18px"></section></main>
<script src="platform.js"></script><script>function load(){platform.loadCollection("/api/disputes/items","#disputesList",(d)=>`<article class="card"><h3>${d.title}</h3><p>${d.reason}</p><span class="badge">${d.resolution}</span></article>`)} platform.bindForm("#disputeForm","/api/disputes/items",(f)=>Object.fromEntries(f),load); load();</script></body></html>
