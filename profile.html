<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile</title><link rel="stylesheet" href="platform.css"></head>
<body>
  <header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="settings.html">Settings</a></nav></header>
  <main class="wrap">
    <section class="hero"><h1>Profile</h1><p class="muted">Your verification, reputation, posts, notes, listings, and reviews live here.</p></section>
    <section id="profile" class="panel"></section>
  </main>
  <script src="platform.js"></script>
  <script>
    platform.requireUser().then((u) => {
      if (!u) return;
      profile.innerHTML = `<h2>${u.name}</h2><p>${u.email}</p><p><span class="badge">${u.university || "Verified student"}</span> <span class="badge">Verified</span></p><p class="muted">Reputation and reviews will grow from completed transactions and helpful contributions.</p>`;
    });
  </script>
</body>
</html>
