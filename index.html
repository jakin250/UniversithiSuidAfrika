<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University SuidAfrika</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #002f6c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .container {
            padding: 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #ffb400;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #e6a200;
        }
    </style>
</head>

<body>

    <header>
        <h1>University SuidAfrika</h1>
    </header>

    <main>

        <section class="card">
            <div class="container">
                <h2>Student Forum</h2>
                <p>Join discussions, share notes, and collaborate with other students.</p>
                <a href="https://universithi-suid-afrika.vercel.app/studentforum.html" class="btn">
                    Go to Forum
                </a>
            </div>
        </section>

        <section class="card">
            <div class="container">
                <h2>Book Store</h2>
                <p>Buy, sell, and exchange textbooks easily.</p>
                <a href="https://universithi-suid-afrika.vercel.app/bookstore.html" class="btn">
                    Visit Book Store
                </a>
            </div>
        </section>

        <section class="card">
            <div class="container">
                <h2>Student Marketplace</h2>
                <p>Trade items, services, and more within the student community.</p>
                <a href="https://universithi-suid-afrika.vercel.app/studentmarketplace.html" class="btn">
                    Open Marketplace
                </a>
            </div>
        </section>

    </main>

</body>
</html>
