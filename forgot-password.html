<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot Password</title><link rel="stylesheet" href="platform.css"></head>
<body>
  <header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="login.html">Login</a></nav></header>
  <main class="wrap">
    <section class="hero"><h1>Password recovery</h1><p class="muted">Enter your student email. The production email sender can be connected later.</p></section>
    <form class="stack" onsubmit="event.preventDefault(); platform.setStatus('Password reset request recorded. Email delivery must be connected in Vercel before messages are sent.');">
      <label>Student email<input type="email" required></label>
      <button>Request reset link</button>
      <p data-status class="status"></p>
    </form>
  </main>
  <script src="platform.js"></script>
</body>
</html>
