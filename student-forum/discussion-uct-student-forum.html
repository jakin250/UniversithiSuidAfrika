<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion | UCT Student Forum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f7fc;
      color: #0a2b3e;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #dce5ec;
    }

    .logo-area h1 {
      font-size: 1.8rem;
      color: #0a2b3e;
    }

    .logo-area .tagline {
      font-size: 0.85rem;
      color: #5a6e7a;
    }

    .back-link {
      color: #0f5b8c;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .btn-primary {
      background: #0f5b8c;
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #0a4368;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #0f5b8c;
      color: #0f5b8c;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Layout */
    .discussion-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
    }

    /* Main Post Card */
    .post-card {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .post-vote-area {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .vote-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f4f9;
      padding: 0.5rem;
      border-radius: 40px;
    }

    .vote-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      transition: 0.1s;
      color: #6c7e8c;
    }

    .vote-btn:hover {
      color: #0f5b8c;
    }

    .vote-count {
      font-weight: 700;
      font-size: 1.1rem;
      margin: 0.2rem 0;
    }

    .post-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e9eef3;
      color: #6c7e8c;
      font-size: 0.9rem;
    }

    .category-badge {
      background: #eef2f7;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #0f5b8c;
    }

    .post-body {
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }

    /* Comments Section */
    .comments-section {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .comment {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #edf2f6;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #6c7e8c;
    }

    .comment-author {
      font-weight: 600;
      color: #0a2b3e;
    }

    .comment-body {
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .comment-actions {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
    }

    .reply-link, .upvote-comment {
      background: none;
      border: none;
      color: #0f5b8c;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .reply-form {
      margin-top: 0.8rem;
      margin-left: 1.5rem;
      display: none;
    }

    .reply-form.active {
      display: block;
    }

    .reply-input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cddfe8;
      border-radius: 16px;
      font-family: inherit;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .comment-vote {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Reply Thread */
    .replies {
      margin-left: 2rem;
      margin-top: 1rem;
      padding-left: 1rem;
      border-left: 2px solid #e0e8f0;
    }

    /* Sidebar */
    .sidebar-card {
      background: white;
      border-radius: 24px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .sidebar-card h3 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      border-left: 4px solid #0f5b8c;
      padding-left: 0.7rem;
    }

    .similar-post {
      padding: 0.8rem 0;
      border-bottom: 1px solid #eef2f6;
      cursor: pointer;
    }

    .similar-post:hover {
      background: #fafdff;
    }

    .similar-title {
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 0.2rem;
    }

    .author-info {
      text-align: center;
      padding: 0.5rem;
    }

    .author-avatar {
      width: 70px;
      height: 70px;
      background: #0f5b8c;
      border-radius: 50%;
      margin: 0 auto 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
    }

    @media (max-width: 800px) {
      .discussion-grid {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="logo-area">
      <h1>STUDENT FORUM</h1>
      <div class="tagline">Your campus. Your voice.</div>
    </div>
    <a href="uct-student-forum-your-campus-your-voice.html" class="back-link" id="backToHome" href="uct-student-forum-your-campus-your-voice.html" href="uct-student-forum-your-campus-your-voice.html">← Back to Forum</a>
  </div>

  <div class="discussion-grid">
    <!-- Main Content -->
    <div>
      <!-- Post Card -->
      <div class="post-card" id="postCard">
        <!-- Dynamic content from JS -->
      </div>

      <!-- Comments Section -->
      <div class="comments-section">
        <h3 style="margin-bottom: 1.5rem;">💬 Comments (<span id="commentCount">0</span>)</h3>
        <div id="commentsContainer"></div>

        <!-- Add a comment -->
        <div style="margin-top: 1.5rem;">
          <textarea id="newCommentInput" rows="3" placeholder="Write a comment..." style="width: 100%; padding: 0.8rem; border: 1px solid #cddfe8; border-radius: 20px; font-family: inherit;"></textarea>
          <button id="submitCommentBtn" class="btn-primary" style="margin-top: 0.8rem;">Post Comment</button>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div>
      <div class="sidebar-card">
        <h3>👤 About the Author</h3>
        <div class="author-info" id="authorInfo">
          <!-- dynamic -->
        </div>
      </div>

      <div class="sidebar-card">
        <h3>🔥 Similar Discussions</h3>
        <div id="similarPosts"></div>
      </div>

      <div class="sidebar-card">
        <h3>📌 Forum Tips</h3>
        <ul style="list-style: none;">
          <li>✓ Upvote helpful replies</li>
          <li>✓ Be respectful and constructive</li>
          <li>✓ Use @mentions to tag peers</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
  // Mock data for the current post (simulating a clicked post from homepage)
  const currentPost = {
    id: 1,
    title: "How do I survive Quantitative Methods?",
    category: "Academic Help",
    author: "Sipho M.",
    authorPoints: 4200,
    authorYear: "2nd Year",
    timeAgo: "3h ago",
    body: "I'm really struggling with QM (Quantitative Methods). The statistics part is overwhelming and I feel like I'm falling behind. Any study tips, resources, or strategies from those who've been through it? Would really appreciate any advice! 🙏",
    votes: 327,
    comments: [
      {
        id: 101,
        author: "Thando M.",
        authorBadge: "3rd Year Engineering",
        time: "2h ago",
        body: "Practice past papers every day! Focus on understanding formulas rather than memorizing. The textbook exercises are key. Also, form a study group - that saved me last semester.",
        votes: 45,
        replies: [
          { id: 1011, author: "Sipho M.", time: "1h ago", body: "Thanks Thando! Any specific past papers you'd recommend?", votes: 12 },
          { id: 1012, author: "Thando M.", time: "45m ago", body: "Start with 2019-2023 papers. The exam structure is similar each year.", votes: 8 }
        ]
      },
      {
        id: 102,
        author: "Lerato K.",
        authorBadge: "Tutor",
        time: "2h ago",
        body: "YouTube is your best friend! Channels like 'StatQuest' and 'Khan Academy' break down tough concepts. Also, don't skip consultation hours - lecturers actually help.",
        votes: 32,
        replies: []
      },
      {
        id: 103,
        author: "Aisha B.",
        authorBadge: "4th Year",
        time: "1h ago",
        body: "Create a formula sheet and update it weekly. Practice with a timer to simulate exam conditions. You've got this! 💪",
        votes: 28,
        replies: []
      }
    ]
  };

  // Similar posts data
  const similarPosts = [
    { id: 2, title: "Best budget laptops for CS students?", votes: 283 },
    { id: 3, title: "Is internship worth it in first year?", votes: 33 },
    { id: 4, title: "Where to find free parking on campus?", votes: 34 },
    { id: 5, title: "Past papers for Financial Accounting II", votes: 35 }
  ];

  // Helper to escape HTML
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Render main post
  function renderPost() {
    const container = document.getElementById('postCard');
    container.innerHTML = `
      <div class="post-vote-area">
        <div class="vote-buttons">
          <button class="vote-btn" id="upvotePost">▲</button>
          <span class="vote-count" id="postVoteCount">${currentPost.votes}</span>
          <button class="vote-btn" id="downvotePost">▼</button>
        </div>
        <div style="flex:1">
          <h1 class="post-title">${escapeHtml(currentPost.title)}</h1>
        </div>
      </div>
      <div class="post-meta">
        <span class="category-badge">${escapeHtml(currentPost.category)}</span>
        <span>📝 by ${escapeHtml(currentPost.author)} • ${currentPost.authorYear}</span>
        <span>🕒 ${currentPost.timeAgo}</span>
      </div>
      <div class="post-body">
        ${escapeHtml(currentPost.body)}
      </div>
    `;

    // Add vote listeners
    document.getElementById('upvotePost')?.addEventListener('click', () => {
      currentPost.votes++;
      document.getElementById('postVoteCount').innerText = currentPost.votes;
    });
    document.getElementById('downvotePost')?.addEventListener('click', () => {
      currentPost.votes--;
      document.getElementById('postVoteCount').innerText = currentPost.votes;
    });
  }

  // Render comments with nested replies
  function renderComments() {
    const container = document.getElementById('commentsContainer');
    const commentCountSpan = document.getElementById('commentCount');
    let totalComments = currentPost.comments.length;
    currentPost.comments.forEach(c => totalComments += c.replies.length);
    commentCountSpan.innerText = totalComments;

    container.innerHTML = currentPost.comments.map(comment => `
      <div class="comment" data-comment-id="${comment.id}">
        <div class="comment-header">
          <span><strong class="comment-author">${escapeHtml(comment.author)}</strong> • ${comment.authorBadge}</span>
          <span>${comment.time}</span>
        </div>
        <div class="comment-body">${escapeHtml(comment.body)}</div>
        <div class="comment-actions">
          <div class="comment-vote">
            <button class="upvote-comment" data-id="${comment.id}">▲ Upvote</button>
            <span id="commentVotes-${comment.id}">${comment.votes}</span>
          </div>
          <button class="reply-link" data-id="${comment.id}">💬 Reply</button>
        </div>
        <div class="replies" id="replies-${comment.id}">
          ${comment.replies.map(reply => `
            <div class="comment" style="margin-left: 0; border-left: none; padding-left: 0;">
              <div class="comment-header">
                <span><strong>${escapeHtml(reply.author)}</strong></span>
                <span>${reply.time}</span>
              </div>
              <div class="comment-body">${escapeHtml(reply.body)}</div>
              <div class="comment-actions">
                <button class="upvote-comment" data-id="${reply.id}">▲ Upvote</button>
                <span id="commentVotes-${reply.id}">${reply.votes}</span>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="reply-form" id="replyForm-${comment.id}">
          <textarea class="reply-input" placeholder="Write a reply..." rows="2"></textarea>
          <button class="btn-outline submit-reply" data-id="${comment.id}" style="margin-top: 0.4rem;">Post Reply</button>
        </div>
      </div>
    `).join('');

    // Attach upvote comment handlers
    document.querySelectorAll('.upvote-comment').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.getAttribute('data-id'));
        // Find comment or reply and increment votes
        let found = false;
        for (let c of currentPost.comments) {
          if (c.id === id) {
            c.votes++;
            document.getElementById(`commentVotes-${id}`).innerText = c.votes;
            found = true;
            break;
          }
          for (let r of c.replies) {
            if (r.id === id) {
              r.votes++;
              document.getElementById(`commentVotes-${id}`).innerText = r.votes;
              found = true;
              break;
            }
          }
          if (found) break;
        }
      });
    });

    // Reply toggle and submit
    document.querySelectorAll('.reply-link').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const commentId = parseInt(btn.getAttribute('data-id'));
        const form = document.getElementById(`replyForm-${commentId}`);
        form.classList.toggle('active');
      });
    });

    document.querySelectorAll('.submit-reply').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const commentId = parseInt(btn.getAttribute('data-id'));
        const formDiv = document.getElementById(`replyForm-${commentId}`);
        const textarea = formDiv.querySelector('.reply-input');
        const replyText = textarea.value.trim();
        if (!replyText) return;

        const newReply = {
          id: Date.now(),
          author: "You (Verified Student)",
          time: "Just now",
          body: replyText,
          votes: 0
        };

        const parentComment = currentPost.comments.find(c => c.id === commentId);
        if (parentComment) {
          parentComment.replies.push(newReply);
          renderComments(); // re-render to update nested structure
        }
      });
    });
  }

  // Render author info sidebar
  function renderAuthorSidebar() {
    const container = document.getElementById('authorInfo');
    container.innerHTML = `
      <div class="author-avatar">👨‍🎓</div>
      <h4>${escapeHtml(currentPost.author)}</h4>
      <p style="color:#6c7e8c; font-size:0.85rem;">${currentPost.authorYear} • ${currentPost.authorPoints.toLocaleString()} points</p>
      <button class="btn-outline" style="margin-top: 0.5rem;">✉️ Message</button>
    `;
  }

  // Render similar posts
  function renderSimilarPosts() {
    const container = document.getElementById('similarPosts');
    container.innerHTML = similarPosts.map(post => `
      <div class="similar-post" data-id="${post.id}">
        <div class="similar-title">📄 ${escapeHtml(post.title)}</div>
        <div class="small-text" style="color:#6c7e8c;">▲ ${post.votes} upvotes</div>
      </div>
    `).join('');

    // Click on similar post alerts (simulate navigation)
    document.querySelectorAll('.similar-post').forEach(el => {
      el.addEventListener('click', () => {
        alert(`🔁 Navigating to: ${el.querySelector('.similar-title')?.innerText}\n(Full detail page would open here)`);
      });
    });
  }

  // Add new comment
  function addComment() {
    const input = document.getElementById('newCommentInput');
    const text = input.value.trim();
    if (!text) return;

    const newComment = {
      id: Date.now(),
      author: "You (Verified)",
      authorBadge: "Student",
      time: "Just now",
      body: text,
      votes: 0,
      replies: []
    };

    currentPost.comments.push(newComment);
    renderComments();
    input.value = '';
  }

  // Back button (simulate)
  document.getElementById('backToHome').addEventListener('click', (e) => {
    e.preventDefault();
    alert('🏠 Returning to homepage (would navigate to index)');
  });

  document.getElementById('submitCommentBtn').addEventListener('click', addComment);

  // Initialize page
  renderPost();
  renderComments();
  renderAuthorSidebar();
  renderSimilarPosts();
</script>
</body>
</html>
