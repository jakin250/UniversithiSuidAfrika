<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Messages - UCT Student Forum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f7fc;
      color: #0a2b3e;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #dce5ec;
    }

    .logo-area h1 {
      font-size: 1.8rem;
      color: #0a2b3e;
    }

    .logo-area .tagline {
      font-size: 0.85rem;
      color: #5a6e7a;
    }

    .back-link {
      color: #0f5b8c;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: white;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      transition: background 0.2s;
    }

    .back-link:hover {
      background: #eef2f7;
    }

    .btn-primary {
      background: #0f5b8c;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.85rem;
    }

    .btn-primary:hover {
      background: #0a4368;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid #0f5b8c;
      color: #0f5b8c;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    /* Messaging Layout */
    .messaging-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      min-height: 600px;
    }

    /* Conversations Sidebar */
    .conversations-sidebar {
      background: #fafcff;
      border-right: 1px solid #e9eef3;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 1.2rem;
      border-bottom: 1px solid #e9eef3;
    }

    .new-msg-btn {
      width: 100%;
    }

    .conversations-list {
      flex: 1;
      overflow-y: auto;
      max-height: 70vh;
    }

    .conversation-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 1rem 1.2rem;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid #eef2f6;
    }

    .conversation-item:hover {
      background: #f0f4f9;
    }

    .conversation-item.active {
      background: #e8f0f7;
      border-left: 3px solid #0f5b8c;
    }

    .conversation-avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0f5b8c, #1e7fb0);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      flex-shrink: 0;
    }

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .conversation-name {
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .conversation-preview {
      font-size: 0.75rem;
      color: #6c7e8c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-time {
      font-size: 0.65rem;
      color: #8ba0b0;
    }

    .unread-badge {
      background: #dc2626;
      color: white;
      border-radius: 30px;
      padding: 0.2rem 0.5rem;
      font-size: 0.65rem;
      font-weight: 600;
    }

    /* Chat Area */
    .chat-area {
      display: flex;
      flex-direction: column;
      background: white;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #e9eef3;
    }

    .chat-contact {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      background: #0f5b8c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .chat-name {
      font-weight: 600;
    }

    .chat-status {
      font-size: 0.7rem;
      color: #10b981;
    }

    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      max-height: 500px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      max-width: 70%;
    }

    .message.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-bubble {
      padding: 0.7rem 1rem;
      border-radius: 20px;
      background: #f0f4f9;
      color: #1e2f3c;
      font-size: 0.85rem;
    }

    .message.sent .message-bubble {
      background: #0f5b8c;
      color: white;
    }

    .message-time {
      font-size: 0.6rem;
      color: #8ba0b0;
      margin-top: 0.2rem;
      text-align: right;
    }

    .message-input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid #e9eef3;
      display: flex;
      gap: 0.8rem;
    }

    .message-input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 40px;
      font-family: inherit;
      resize: none;
    }

    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8ba0b0;
      text-align: center;
      padding: 2rem;
    }

    @media (max-width: 700px) {
      .container {
        padding: 1rem;
      }
      .messaging-grid {
        grid-template-columns: 1fr;
      }
      .conversations-sidebar {
        max-height: 300px;
      }
      .message {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="logo-area">
      <h1>STUDENT FORUM</h1>
      <div class="tagline">Your campus. Your voice.</div>
    </div>
    <a href="uct-student-forum-your-campus-your-voice.html" class="back-link" id="backToForum" href="uct-student-forum-your-campus-your-voice.html" href="uct-student-forum-your-campus-your-voice.html">← Back to Forum</a>
  </div>

  <div class="messaging-grid">
    <!-- Conversations Sidebar -->
    <div class="conversations-sidebar">
      <div class="sidebar-header">
        <button id="newMessageBtn" class="btn-primary new-msg-btn">✉️ New Message</button>
      </div>
      <div class="conversations-list" id="conversationsList"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
      <div class="chat-header" id="chatHeader">
        <div style="display: flex; align-items: center; gap: 0.8rem;">
          <div class="chat-avatar">👤</div>
          <div>
            <div class="chat-name">Select a conversation</div>
            <div class="chat-status">Start messaging</div>
          </div>
        </div>
      </div>
      <div class="messages-container" id="messagesContainer">
        <div class="empty-chat">
          💬 Select a conversation from the left<br>
          or start a new message
        </div>
      </div>
      <div class="message-input-area" id="messageInputArea" style="display: none;">
        <textarea id="messageInput" class="message-input" rows="1" placeholder="Type a message..."></textarea>
        <button id="sendMessageBtn" class="btn-primary">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Mock conversations and messages
  let conversations = [
    {
      id: 1,
      userId: 101,
      name: "Sipho M.",
      avatar: "SM",
      lastMessage: "Thanks for the help with QM!",
      lastMessageTime: "2h ago",
      unread: true,
      online: true,
      messages: [
        { id: 1, senderId: 101, text: "Hey! Thanks for the study tips.", time: "Yesterday, 3:30 PM" },
        { id: 2, senderId: "me", text: "You're welcome! Let me know if you need more help.", time: "Yesterday, 4:00 PM" },
        { id: 3, senderId: 101, text: "Actually, do you have the past paper solutions?", time: "Yesterday, 4:15 PM" },
        { id: 4, senderId: "me", text: "Yes, I'll share the link in the study group.", time: "2h ago" },
        { id: 5, senderId: 101, text: "Thanks for the help with QM!", time: "2h ago" }
      ]
    },
    {
      id: 2,
      userId: 102,
      name: "Lerato K.",
      avatar: "LK",
      lastMessage: "Check out this laptop deal",
      lastMessageTime: "1d ago",
      unread: false,
      online: false,
      messages: [
        { id: 1, senderId: 102, text: "Hey! Found a great laptop deal for CS students.", time: "1d ago" },
        { id: 2, senderId: 102, text: "Check out this laptop deal", time: "1d ago" },
        { id: 3, senderId: "me", text: "Thanks! Send me the link", time: "1d ago" }
      ]
    },
    {
      id: 3,
      userId: 103,
      name: "Aisha B.",
      avatar: "AB",
      lastMessage: "Study group tomorrow?",
      lastMessageTime: "3d ago",
      unread: false,
      online: true,
      messages: [
        { id: 1, senderId: 103, text: "Are we meeting for the study group tomorrow?", time: "3d ago" },
        { id: 2, senderId: "me", text: "Yes, 4pm at the library", time: "3d ago" },
        { id: 3, senderId: 103, text: "Study group tomorrow?", time: "3d ago" }
      ]
    }
  ];

  let currentConversationId = null;
  const currentUserId = "me";
  const currentUserName = "You";

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function renderConversations() {
    const container = document.getElementById('conversationsList');
    container.innerHTML = conversations.map(conv => `
      <div class="conversation-item ${currentConversationId === conv.id ? 'active' : ''}" data-id="${conv.id}">
        <div class="conversation-avatar">${escapeHtml(conv.avatar)}</div>
        <div class="conversation-info">
          <div class="conversation-name">${escapeHtml(conv.name)} ${conv.online ? '🟢' : '⚫'}</div>
          <div class="conversation-preview">${escapeHtml(conv.lastMessage)}</div>
        </div>
        <div>
          <div class="conversation-time">${conv.lastMessageTime}</div>
          ${conv.unread ? `<div class="unread-badge">New</div>` : ''}
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.conversation-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = parseInt(item.getAttribute('data-id'));
        openConversation(id);
      });
    });
  }

  function openConversation(convId) {
    currentConversationId = convId;
    const conversation = conversations.find(c => c.id === convId);
    if (!conversation) return;

    // Mark as read
    conversation.unread = false;
    renderConversations();
    renderChatHeader(conversation);
    renderMessages(conversation);
    
    // Show input area
    document.getElementById('messageInputArea').style.display = 'flex';
  }

  function renderChatHeader(conversation) {
    const header = document.getElementById('chatHeader');
    header.innerHTML = `
      <div class="chat-contact">
        <div class="chat-avatar">${escapeHtml(conversation.avatar)}</div>
        <div>
          <div class="chat-name">${escapeHtml(conversation.name)}</div>
          <div class="chat-status">${conversation.online ? '🟢 Online' : '⚫ Offline'}</div>
        </div>
      </div>
      <button class="btn-outline" id="clearChatBtn" style="font-size:0.7rem;">Clear</button>
    `;
    document.getElementById('clearChatBtn')?.addEventListener('click', () => {
      if (confirm('Clear this conversation?')) {
        conversation.messages = [];
        renderMessages(conversation);
        showToast('Conversation cleared');
      }
    });
  }

  function renderMessages(conversation) {
    const container = document.getElementById('messagesContainer');
    if (!conversation.messages.length) {
      container.innerHTML = '<div class="empty-chat">No messages yet. Send a message to start the conversation!</div>';
      return;
    }

    container.innerHTML = conversation.messages.map(msg => `
      <div class="message ${msg.senderId === currentUserId ? 'sent' : 'received'}">
        <div>
          <div class="message-bubble">${escapeHtml(msg.text)}</div>
          <div class="message-time">${msg.time}</div>
        </div>
      </div>
    `).join('');
    
    // Scroll to bottom
    container.scrollTop = container.scrollHeight;
  }

  function sendMessage() {
    if (!currentConversationId) {
      showToast('Please select a conversation first');
      return;
    }
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    const conversation = conversations.find(c => c.id === currentConversationId);
    if (conversation) {
      const newMessage = {
        id: conversation.messages.length + 1,
        senderId: currentUserId,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      conversation.messages.push(newMessage);
      conversation.lastMessage = text;
      conversation.lastMessageTime = "Just now";
      
      renderMessages(conversation);
      renderConversations();
      input.value = '';
      
      // Simulate reply after 2 seconds (auto-reply for demo)
      if (text.toLowerCase().includes('help') || text.toLowerCase().includes('question')) {
        setTimeout(() => {
          const autoReply = {
            id: conversation.messages.length + 1,
            senderId: conversation.userId,
            text: "Thanks for your message! I'll get back to you soon.",
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          conversation.messages.push(autoReply);
          conversation.lastMessage = autoReply.text;
          renderMessages(conversation);
          renderConversations();
          showToast('New reply received');
        }, 2000);
      }
    }
  }

  function newConversation() {
    const userName = prompt("Enter the username of the person you want to message:");
    if (!userName) return;
    
    const newId = conversations.length + 10;
    const newConv = {
      id: newId,
      userId: 999,
      name: userName,
      avatar: userName.substring(0, 2).toUpperCase(),
      lastMessage: "Say hi!",
      lastMessageTime: "Just now",
      unread: false,
      online: true,
      messages: [
        { id: 1, senderId: "me", text: `Hi ${userName}!`, time: "Just now" }
      ]
    };
    conversations.unshift(newConv);
    renderConversations();
    openConversation(newId);
    showToast(`Conversation with ${userName} started`);
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.style.position = 'fixed';
    toast.style.bottom = '20px';
    toast.style.right = '20px';
    toast.style.background = '#1e2f3c';
    toast.style.color = 'white';
    toast.style.padding = '10px 20px';
    toast.style.borderRadius = '40px';
    toast.style.fontSize = '0.85rem';
    toast.style.zIndex = '1000';
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // Event listeners
  document.getElementById('sendMessageBtn')?.addEventListener('click', sendMessage);
  document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  document.getElementById('newMessageBtn')?.addEventListener('click', newConversation);
  document.getElementById('backToForum')?.addEventListener('click', (e) => {
    e.preventDefault();
    alert('← Returning to homepage (simulated navigation)');
  });

  // Initialize
  renderConversations();
  
  // Auto-select first conversation
  if (conversations.length > 0) {
    openConversation(conversations[0].id);
  }
</script>
</body>
</html>
