<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Quant Methods Warriors - Study Group | UNISA Student Forum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f7fc;
      color: #0a2b3e;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #dce5ec;
    }

    .logo-area h1 {
      font-size: 1.8rem;
      color: #0a2b3e;
    }

    .logo-area .tagline {
      font-size: 0.85rem;
      color: #5a6e7a;
    }

    .back-link {
      color: #0f5b8c;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: white;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      transition: background 0.2s;
    }

    .back-link:hover {
      background: #eef2f7;
    }

    .btn-primary {
      background: #0f5b8c;
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #0a4368;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid #0f5b8c;
      color: #0f5b8c;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      cursor: pointer;
    }

    /* Layout */
    .two-column {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
    }

    /* Group Header */
    .group-header {
      background: white;
      border-radius: 28px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .group-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .group-course {
      display: inline-block;
      background: #eef2f7;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    .group-description {
      color: #4a627a;
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .group-stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin: 1rem 0;
      padding: 1rem 0;
      border-top: 1px solid #eef2f6;
      border-bottom: 1px solid #eef2f6;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0f5b8c;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #6c7e8c;
    }

    .join-section {
      margin-top: 1rem;
    }

    /* Tabs */
    .group-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: white;
      padding: 0.5rem;
      border-radius: 60px;
      width: fit-content;
    }

    .tab-btn {
      padding: 0.6rem 1.5rem;
      border: none;
      background: transparent;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: #0f5b8c;
      color: white;
    }

    /* Content Panels */
    .tab-pane {
      display: none;
      background: white;
      border-radius: 24px;
      padding: 1.5rem;
    }

    .tab-pane.active {
      display: block;
    }

    /* Members List */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .member-card {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem;
      background: #f8fafd;
      border-radius: 16px;
    }

    .member-avatar {
      width: 40px;
      height: 40px;
      background: #0f5b8c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    .member-info {
      flex: 1;
    }

    .member-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .member-role {
      font-size: 0.7rem;
      color: #6c7e8c;
    }

    /* Sessions List */
    .session-card {
      padding: 1rem;
      border-bottom: 1px solid #eef2f6;
    }

    .session-title {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .session-details {
      font-size: 0.8rem;
      color: #6c7e8c;
    }

    /* Discussion Threads */
    .thread-card {
      padding: 1rem;
      border-bottom: 1px solid #eef2f6;
      cursor: pointer;
    }

    .thread-title {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .thread-meta {
      font-size: 0.7rem;
      color: #8ba0b0;
    }

    /* Resources */
    .resource-item {
      padding: 0.8rem;
      background: #f8fafd;
      border-radius: 16px;
      margin-bottom: 0.8rem;
    }

    /* Sidebar */
    .sidebar-card {
      background: white;
      border-radius: 24px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .sidebar-card h3 {
      font-size: 1rem;
      margin-bottom: 0.8rem;
      border-left: 3px solid #0f5b8c;
      padding-left: 0.6rem;
    }

    @media (max-width: 800px) {
      .two-column {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 1rem;
      }
      .group-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="logo-area">
      <h1>STUDENT FORUM</h1>
      <div class="tagline">Your campus. Your voice.</div>
    </div>
    <a href="unisa-student-forum-your-campus-your-voice.html" class="back-link" id="backToForum" href="unisa-student-forum-your-campus-your-voice.html" href="unisa-student-forum-your-campus-your-voice.html">← Back to Forum</a>
  </div>

  <div class="two-column">
    <!-- Main Content -->
    <div>
      <!-- Group Header -->
      <div class="group-header" id="groupHeader"></div>

      <!-- Tabs -->
      <div class="group-tabs">
        <button class="tab-btn active" data-tab="discussions">💬 Discussions</button>
        <button class="tab-btn" data-tab="members">👥 Members</button>
        <button class="tab-btn" data-tab="sessions">📅 Upcoming Sessions</button>
        <button class="tab-btn" data-tab="resources">📚 Resources</button>
      </div>

      <div id="discussions" class="tab-pane active">
        <div id="discussionsContainer"></div>
        <textarea id="newThreadInput" rows="2" placeholder="Start a new discussion..." style="width:100%; margin-top:1rem; padding:0.8rem; border-radius:16px; border:1px solid #cddfe8;"></textarea>
        <button id="postThreadBtn" class="btn-primary" style="margin-top:0.5rem;">Post Discussion</button>
      </div>

      <div id="members" class="tab-pane">
        <div id="membersContainer"></div>
      </div>

      <div id="sessions" class="tab-pane">
        <div id="sessionsContainer"></div>
        <button id="addSessionBtn" class="btn-outline" style="margin-top:1rem;">+ Schedule Session</button>
      </div>

      <div id="resources" class="tab-pane">
        <div id="resourcesContainer"></div>
        <button id="addResourceBtn" class="btn-outline" style="margin-top:1rem;">+ Share Resource</button>
      </div>
    </div>

    <!-- Sidebar -->
    <div>
      <div class="sidebar-card">
        <h3>📌 Group Info</h3>
        <div id="groupInfoSidebar"></div>
      </div>
      <div class="sidebar-card">
        <h3>👑 Group Admins</h3>
        <div id="adminsList"></div>
      </div>
      <div class="sidebar-card">
        <h3>🔗 Quick Links</h3>
        <ul style="list-style: none; font-size:0.85rem;">
          <li>📅 <a href="unisa-student-forum-your-campus-your-voice.html" style="color:#0f5b8c;">Add to Calendar</a></li>
          <li>📧 <a href="unisa-student-forum-your-campus-your-voice.html" style="color:#0f5b8c;">Email Group</a></li>
          <li>🚩 <a href="unisa-student-forum-your-campus-your-voice.html" style="color:#dc2626;">Report Group</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
  // Mock Study Group Data
  const studyGroup = {
    id: 1,
    name: "📊 Quant Methods Warriors",
    course: "Quantitative Methods",
    description: "Weekly problem-solving sessions every Wednesday @ 4pm. We share notes, practice past papers, and help each other understand statistical concepts. All levels welcome!",
    membersCount: 12,
    maxMembers: 20,
    sessionsCount: 4,
    resourcesCount: 8,
    createdAt: "March 2026",
    isJoined: false
  };

  const members = [
    { id: 1, name: "Sipho M.", role: "Group Creator", avatar: "SM", isOnline: true },
    { id: 2, name: "Thando M.", role: "Moderator", avatar: "TM", isOnline: true },
    { id: 3, name: "Lerato K.", role: "Member", avatar: "LK", isOnline: false },
    { id: 4, name: "Aisha B.", role: "Member", avatar: "AB", isOnline: true },
    { id: 5, name: "Jordan P.", role: "Member", avatar: "JP", isOnline: false },
    { id: 6, name: "Naledi M.", role: "Member", avatar: "NM", isOnline: true },
    { id: 7, name: "Michael B.", role: "Member", avatar: "MB", isOnline: false },
    { id: 8, name: "Zanele P.", role: "Member", avatar: "ZP", isOnline: false }
  ];

  const discussions = [
    { id: 1, title: "Anyone struggling with hypothesis testing?", author: "Sipho M.", timeAgo: "2h ago", replies: 5, content: "Let's work through some examples together." },
    { id: 2, title: "Past paper 2023 - Question 4 discussion", author: "Thando M.", timeAgo: "1d ago", replies: 12, content: "How did everyone approach the regression analysis?" },
    { id: 3, title: "Recommended YouTube channels for QM", author: "Lerato K.", timeAgo: "3d ago", replies: 8, content: "StatQuest and Khan Academy are lifesavers!" }
  ];

  const sessions = [
    { id: 1, title: "Weekly Problem-Solving", date: "Tomorrow, 4:00 PM", location: "Online (Zoom)", attendees: 8 },
    { id: 2, title: "Past Paper Walkthrough", date: "Friday, 3:00 PM", location: "Library - Study Room 4", attendees: 5 },
    { id: 3, title: "Exam Prep Bootcamp", date: "May 20, 2:00 PM", location: "Online (Discord)", attendees: 12 }
  ];

  const resources = [
    { id: 1, title: "QM Formula Sheet 2026", type: "PDF", author: "Sipho M.", link: "#" },
    { id: 2, title: "Past Papers 2019-2024", type: "Drive Link", author: "Thando M.", link: "#" },
    { id: 3, title: "Statistics Cheat Sheet", type: "Image", author: "Lerato K.", link: "#" }
  ];

  const admins = members.filter(m => m.role === "Group Creator" || m.role === "Moderator");

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function renderGroupHeader() {
    const container = document.getElementById('groupHeader');
    container.innerHTML = `
      <div class="group-title">${escapeHtml(studyGroup.name)}</div>
      <div class="group-course">📚 ${escapeHtml(studyGroup.course)}</div>
      <div class="group-description">${escapeHtml(studyGroup.description)}</div>
      <div class="group-stats">
        <div class="stat"><div class="stat-number">${studyGroup.membersCount}/${studyGroup.maxMembers}</div><div class="stat-label">Members</div></div>
        <div class="stat"><div class="stat-number">${studyGroup.sessionsCount}</div><div class="stat-label">Sessions</div></div>
        <div class="stat"><div class="stat-number">${studyGroup.resourcesCount}</div><div class="stat-label">Resources</div></div>
      </div>
      <div class="join-section">
        <button id="joinLeaveBtn" class="${studyGroup.isJoined ? 'btn-outline' : 'btn-primary'}">${studyGroup.isJoined ? 'Leave Group' : 'Join Group'}</button>
      </div>
    `;
    
    document.getElementById('joinLeaveBtn')?.addEventListener('click', () => {
      studyGroup.isJoined = !studyGroup.isJoined;
      renderGroupHeader();
      renderSidebarInfo();
      showToast(studyGroup.isJoined ? '✅ Joined the study group!' : '👋 Left the study group');
    });
  }

  function renderDiscussions() {
    const container = document.getElementById('discussionsContainer');
    container.innerHTML = discussions.map(d => `
      <div class="thread-card" data-id="${d.id}">
        <div class="thread-title">💬 ${escapeHtml(d.title)}</div>
        <div class="thread-meta">by ${escapeHtml(d.author)} • ${d.timeAgo} • ${d.replies} replies</div>
      </div>
    `).join('');
    
    document.querySelectorAll('.thread-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.getAttribute('data-id');
        const thread = discussions.find(d => d.id == id);
        window.location.href = `discussion-unisa-student-forum.html?id=${thread.id}`;
      });
    });
  }

  function renderMembers() {
    const container = document.getElementById('membersContainer');
    container.innerHTML = `
      <div class="members-grid">
        ${members.map(m => `
          <div class="member-card">
            <div class="member-avatar">${escapeHtml(m.avatar)}</div>
            <div class="member-info">
              <div class="member-name">${escapeHtml(m.name)} ${m.isOnline ? '🟢' : '⚫'}</div>
              <div class="member-role">${escapeHtml(m.role)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderSessions() {
    const container = document.getElementById('sessionsContainer');
    container.innerHTML = sessions.map(s => `
      <div class="session-card">
        <div class="session-title">📅 ${escapeHtml(s.title)}</div>
        <div class="session-details">🕒 ${s.date} • 📍 ${s.location} • 👥 ${s.attendees} attending</div>
      </div>
    `).join('');
  }

  function renderResources() {
    const container = document.getElementById('resourcesContainer');
    container.innerHTML = resources.map(r => `
      <div class="resource-item">
        <strong>📄 ${escapeHtml(r.title)}</strong><br>
        <span style="font-size:0.7rem; color:#6c7e8c;">${r.type} • by ${r.author}</span>
      </div>
    `).join('');
  }

  function renderSidebarInfo() {
    const container = document.getElementById('groupInfoSidebar');
    container.innerHTML = `
      <p><strong>Created:</strong> ${studyGroup.createdAt}</p>
      <p><strong>Course Code:</strong> QM1502</p>
      <p><strong>Meeting Format:</strong> Hybrid (Online + In-person)</p>
      <p><strong>Language:</strong> English</p>
    `;
    
    const adminsContainer = document.getElementById('adminsList');
    adminsContainer.innerHTML = admins.map(a => `
      <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;">
        <div class="member-avatar" style="width:30px; height:30px; font-size:0.8rem;">${a.avatar}</div>
        <span>${escapeHtml(a.name)} <span style="font-size:0.7rem; color:#6c7e8c;">(${a.role})</span></span>
      </div>
    `).join('');
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.style.position = 'fixed';
    toast.style.bottom = '20px';
    toast.style.right = '20px';
    toast.style.background = '#1e2f3c';
    toast.style.color = 'white';
    toast.style.padding = '10px 20px';
    toast.style.borderRadius = '40px';
    toast.style.fontSize = '0.85rem';
    toast.style.zIndex = '1000';
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // Tab switching
  function initTabs() {
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const tabId = tab.getAttribute('data-tab');
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
      });
    });
  }

  // Post new discussion
  document.getElementById('postThreadBtn')?.addEventListener('click', () => {
    const input = document.getElementById('newThreadInput');
    const text = input.value.trim();
    if (!text) {
      showToast('Please write something before posting');
      return;
    }
    const newThread = {
      id: discussions.length + 1,
      title: text.length > 50 ? text.substring(0, 50) + '...' : text,
      author: "You",
      timeAgo: "Just now",
      replies: 0,
      content: text
    };
    discussions.unshift(newThread);
    renderDiscussions();
    input.value = '';
    showToast('✅ Discussion posted!');
  });

  // Placeholder for adding session/resource
  document.getElementById('addSessionBtn')?.addEventListener('click', () => {
    showToast('📅 Session scheduling will be available in a future update.');
  });
  document.getElementById('addResourceBtn')?.addEventListener('click', () => {
    showToast('📚 Resource sharing will be available in a future update.');
  });

  // Back button
  document.getElementById('backToForum')?.addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'unisa-student-forum-your-campus-your-voice.html';
  });

  // Initialize all
  renderGroupHeader();
  renderDiscussions();
  renderMembers();
  renderSessions();
  renderResources();
  renderSidebarInfo();
  initTabs();
</script>
</body>
</html>
