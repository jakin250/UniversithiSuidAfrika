<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Study Groups - UNISA Student Forum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f7fc;
      color: #0a2b3e;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #dce5ec;
    }

    .logo-area h1 {
      font-size: 1.8rem;
      color: #0a2b3e;
    }

    .logo-area .tagline {
      font-size: 0.85rem;
      color: #5a6e7a;
    }

    .back-link {
      color: #0f5b8c;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: white;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      transition: background 0.2s;
    }

    .back-link:hover {
      background: #eef2f7;
    }

    .btn-primary {
      background: #0f5b8c;
      color: white;
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.9rem;
    }

    .btn-primary:hover {
      background: #0a4368;
    }

    .btn-secondary {
      background: white;
      border: 1.5px solid #0f5b8c;
      color: #0f5b8c;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-secondary:hover {
      background: #e6f0f8;
    }

    /* Hero Section */
    .hero-section {
      background: linear-gradient(135deg, #e1eef9 0%, #ffffff 100%);
      border-radius: 28px;
      padding: 2rem 2rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .hero-section h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .hero-section p {
      color: #4a6f8c;
      max-width: 600px;
      margin: 0 auto 1rem;
    }

    /* Filters */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: white;
      padding: 1rem 1.5rem;
      border-radius: 20px;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 1px solid #cddfe8;
      border-radius: 40px;
      font-family: inherit;
    }

    .filter-group select {
      padding: 0.6rem 1rem;
      border: 1px solid #cddfe8;
      border-radius: 40px;
      background: white;
      font-family: inherit;
      cursor: pointer;
    }

    /* Study Groups Grid */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .group-card {
      background: white;
      border-radius: 24px;
      padding: 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .group-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .group-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0a2b3e;
    }

    .group-badge {
      background: #eef2f7;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .group-course {
      color: #0f5b8c;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .group-description {
      font-size: 0.85rem;
      color: #4a627a;
      margin: 0.8rem 0;
      line-height: 1.5;
    }

    .group-stats {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: #6c7e8c;
      margin: 0.8rem 0;
      flex-wrap: wrap;
    }

    .group-members {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .join-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.6rem;
      border-radius: 40px;
      font-weight: 600;
      transition: 0.2s;
    }

    /* Modal for creating/joining */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 32px;
      max-width: 550px;
      width: 90%;
      padding: 2rem;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0 1rem;
      border: 1.5px solid #e0e9f0;
      border-radius: 20px;
      font-family: inherit;
    }

    .modal-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    @media (max-width: 750px) {
      .container {
        padding: 1rem;
      }
      .groups-grid {
        grid-template-columns: 1fr;
      }
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      background: white;
      border-radius: 24px;
      color: #7c93a8;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="logo-area">
      <h1>STUDENT FORUM</h1>
      <div class="tagline">Your campus. Your voice.</div>
    </div>
    <a href="unisa-student-forum-your-campus-your-voice.html" class="back-link" id="backToForum" href="unisa-student-forum-your-campus-your-voice.html" href="unisa-student-forum-your-campus-your-voice.html">← Back to Forum</a>
  </div>

  <div class="hero-section">
    <h2>📚 Study Groups</h2>
    <p>Find your study crew, share resources, and ace your courses together.</p>
    <button id="createGroupBtn" class="btn-primary">➕ Create New Study Group</button>
  </div>

  <div class="filter-bar">
    <div class="search-box">
      <input type="text" id="searchGroups" placeholder="Search by course or name...">
    </div>
    <div class="filter-group">
      <select id="courseFilter">
        <option value="all">All Courses</option>
        <option value="Quantitative Methods">Quantitative Methods</option>
        <option value="Financial Accounting">Financial Accounting</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Physics">Physics</option>
        <option value="Calculus">Calculus</option>
        <option value="Economics">Economics</option>
      </select>
    </div>
  </div>

  <div id="groupsContainer" class="groups-grid">
    <!-- dynamic cards -->
  </div>

  <!-- Create/Edit Modal -->
  <div id="groupModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Create a Study Group</h3>
      <input type="text" id="groupName" placeholder="Group name (e.g., QM Study Squad)" maxlength="50">
      <select id="groupCourse">
        <option value="">Select course</option>
        <option value="Quantitative Methods">Quantitative Methods</option>
        <option value="Financial Accounting">Financial Accounting</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Physics">Physics</option>
        <option value="Calculus">Calculus</option>
        <option value="Economics">Economics</option>
      </select>
      <textarea id="groupDesc" rows="3" placeholder="Describe your study group (meeting times, goals, etc.)"></textarea>
      <input type="number" id="groupCapacity" placeholder="Max members (optional)" min="2" max="50">
      <div class="modal-buttons">
        <button id="saveGroupBtn" class="btn-primary">Create Group</button>
        <button id="closeModalBtn" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Mock study groups data
    let studyGroups = [
      {
        id: 1,
        name: "📊 Quant Methods Warriors",
        course: "Quantitative Methods",
        description: "Weekly problem-solving sessions every Wednesday @ 4pm. We share notes and practice past papers together!",
        members: 12,
        maxMembers: 20,
        joinStatus: false,
        createdAt: "2025-03-01"
      },
      {
        id: 2,
        name: "💻 CS Study Squad",
        course: "Computer Science",
        description: "Focus on Data Structures & Algorithms. Discord study sessions + collaborative coding.",
        members: 8,
        maxMembers: 15,
        joinStatus: false,
        createdAt: "2025-03-10"
      },
      {
        id: 3,
        name: "📖 Accounting Masters",
        course: "Financial Accounting",
        description: "Group for Financial Accounting II & III. Weekly case study reviews and tutoring.",
        members: 5,
        maxMembers: 12,
        joinStatus: false,
        createdAt: "2025-03-15"
      },
      {
        id: 4,
        name: "⚛️ Physics Problem Solvers",
        course: "Physics",
        description: "Focus on thermodynamics and electromagnetism. In-person and virtual options.",
        members: 9,
        maxMembers: 18,
        joinStatus: false,
        createdAt: "2025-03-20"
      },
      {
        id: 5,
        name: "📈 Econ Discussion Hub",
        course: "Economics",
        description: "Micro & Macro study group. Share articles, past papers, and prep for exams.",
        members: 15,
        maxMembers: 25,
        joinStatus: false,
        createdAt: "2025-03-25"
      },
      {
        id: 6,
        name: "🧮 Calculus Collective",
        course: "Calculus",
        description: "Daily practice problems, peer tutoring, and test prep for MAM1000W.",
        members: 6,
        maxMembers: 10,
        joinStatus: false,
        createdAt: "2025-04-01"
      }
    ];

    let currentUserJoinedGroups = []; // store ids of groups user joined

    function renderGroups() {
      const searchTerm = document.getElementById('searchGroups').value.toLowerCase();
      const courseFilter = document.getElementById('courseFilter').value;
      
      let filtered = studyGroups.filter(group => {
        const matchesSearch = group.name.toLowerCase().includes(searchTerm) || group.course.toLowerCase().includes(searchTerm);
        const matchesCourse = courseFilter === 'all' || group.course === courseFilter;
        return matchesSearch && matchesCourse;
      });

      const container = document.getElementById('groupsContainer');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">📭 No study groups found. Be the first to <button class="btn-secondary" id="createEmptyBtn" style="margin-top: 0.5rem;">create one!</button></div>`;
        const emptyBtn = document.getElementById('createEmptyBtn');
        if (emptyBtn) emptyBtn.addEventListener('click', () => openCreateModal());
        return;
      }

      container.innerHTML = filtered.map(group => {
        const isJoined = currentUserJoinedGroups.includes(group.id);
        const membersStatus = `${group.members} / ${group.maxMembers || '∞'} members`;
        return `
          <div class="group-card" data-id="${group.id}">
            <div class="group-header">
              <span class="group-title">${escapeHtml(group.name)}</span>
              <span class="group-badge">${escapeHtml(group.course)}</span>
            </div>
            <div class="group-course">📚 ${escapeHtml(group.course)}</div>
            <div class="group-description">${escapeHtml(group.description)}</div>
            <div class="group-stats">
              <span class="group-members">👥 ${membersStatus}</span>
              <span>⭐ ${group.members * 3} points</span>
            </div>
            <button class="join-btn ${isJoined ? 'btn-secondary' : 'btn-primary'}" data-id="${group.id}">
              ${isJoined ? '✓ Joined' : '➕ Join Group'}
            </button>
          </div>
        `;
      }).join('');

      // Attach join button handlers
      document.querySelectorAll('.join-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const groupId = parseInt(btn.getAttribute('data-id'));
          const group = studyGroups.find(g => g.id === groupId);
          if (!group) return;
          
          if (currentUserJoinedGroups.includes(groupId)) {
            alert(`You're already a member of "${group.name}"`);
            return;
          }
          
          if (group.members >= group.maxMembers && group.maxMembers) {
            alert(`Sorry, "${group.name}" is full. Max capacity reached.`);
            return;
          }
          
          // Join group
          currentUserJoinedGroups.push(groupId);
          group.members += 1;
          renderGroups();
          alert(`🎉 You joined "${group.name}"! Check your dashboard for group updates.`);
        });
      });

      // Card click to view details (simulate)
      document.querySelectorAll('.group-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('join-btn')) return;
          const id = parseInt(card.getAttribute('data-id'));
          const group = studyGroups.find(g => g.id === id);
          if (group) {
            window.location.href = `quant-methods-warriors-study-group-unisa-student-forum.html?group=${id}`;
          }
        });
      });
    }

    function openCreateModal() {
      document.getElementById('modalTitle').innerText = "Create a Study Group";
      document.getElementById('groupName').value = "";
      document.getElementById('groupCourse').value = "";
      document.getElementById('groupDesc').value = "";
      document.getElementById('groupCapacity').value = "";
      document.getElementById('groupModal').classList.add('active');
      // Change save button behavior to create
      const saveBtn = document.getElementById('saveGroupBtn');
      saveBtn.onclick = () => createNewGroup();
    }

    function createNewGroup() {
      const name = document.getElementById('groupName').value.trim();
      const course = document.getElementById('groupCourse').value;
      const desc = document.getElementById('groupDesc').value.trim();
      const capacityRaw = document.getElementById('groupCapacity').value;
      const maxMembers = capacityRaw ? parseInt(capacityRaw) : 30;
      
      if (!name) {
        alert("Please enter a group name.");
        return;
      }
      if (!course) {
        alert("Please select a course.");
        return;
      }
      if (!desc) {
        alert("Please add a description for your group.");
        return;
      }
      
      const newId = Date.now();
      const newGroup = {
        id: newId,
        name: name,
        course: course,
        description: desc,
        members: 1,
        maxMembers: maxMembers,
        joinStatus: false,
        createdAt: new Date().toISOString()
      };
      studyGroups.unshift(newGroup);
      currentUserJoinedGroups.push(newId); // creator automatically joins
      renderGroups();
      document.getElementById('groupModal').classList.remove('active');
      alert(`✨ Study group "${name}" created successfully! Share the link with classmates.`);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // Event Listeners
    document.getElementById('createGroupBtn').addEventListener('click', openCreateModal);
    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('groupModal').classList.remove('active');
    });
    document.getElementById('searchGroups').addEventListener('input', () => renderGroups());
    document.getElementById('courseFilter').addEventListener('change', () => renderGroups());
    document.getElementById('backToForum').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'unisa-student-forum-your-campus-your-voice.html';
    });

    // Close modal when clicking outside
    window.addEventListener('click', (e) => {
      const modal = document.getElementById('groupModal');
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });

    renderGroups();
  </script>
</body>
</html>
