<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Posts - Student Forum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --reddit-orange: #ff4500;
            --reddit-blue: #0079d3;
            --bg-primary: #0e1113;
            --bg-secondary: #1a1d1f;
            --text-primary: #d7dadc;
            --text-secondary: #818384;
            --border-color: #343536;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--reddit-orange);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: var(--reddit-blue);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .trend-icon {
            font-size: 2rem;
        }

        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .post-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .post-card:hover {
            background: var(--bg-primary);
            border-color: var(--reddit-blue);
            box-shadow: 0 0 15px rgba(0, 121, 211, 0.2);
        }

        .post-card-rank {
            display: inline-block;
            background: var(--reddit-orange);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .post-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--reddit-blue);
        }

        .post-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .post-stats {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }

        footer a {
            color: var(--reddit-blue);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="studentforum.html" class="nav-brand">r/SA_Students</a>
        <div class="nav-links">
            <a href="studentforum.html">Home</a>
            <a href="forum-browse.html">Browse</a>
            <a href="forum-trending.html">Trending</a>
            <a href="javascript:alert('Sign in to create a post')">Create Post</a>
        </div>
    </nav>

    <div class="container">
        <h1><span class="trend-icon">🔥</span> Trending Posts</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Most active discussions from the past 24 hours</p>

        <div class="posts-list" id="trendingList">
            <div class="empty-state">
                <div class="empty-state-icon">🔥</div>
                <p>No trending posts yet. <a href="studentforum.html">Start a discussion!</a></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Student Forum. <a href="studentforum.html">Back to Forum</a></p>
    </footer>

    <script src="realtime.js"></script>
    <script>
        async function loadTrendingPosts() {
            try {
                const out = await sharedCampus.api('/api/forum/posts', 'GET');
                const posts = (out.posts || [])
                    .sort((a, b) => (b.votes * 2 + b.comments) - (a.votes * 2 + a.comments))
                    .slice(0, 20);

                const trendingList = document.getElementById('trendingList');
                if (posts.length === 0) {
                    trendingList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔥</div><p>No trending posts yet. <a href="studentforum.html">Start a discussion!</a></p></div>';
                    return;
                }

                trendingList.innerHTML = posts.map((post, idx) => `
                    <div class="post-card" onclick="alert('View post: ' + this.querySelector('.post-title').textContent)">
                        <div class="post-card-rank">#${idx + 1} Trending</div>
                        <div class="post-title">${post.title}</div>
                        <div class="post-meta">
                            <span>${post.author}</span>
                            <span>${new Date(post.time).toLocaleDateString()}</span>
                            <span style="margin-left: auto;">📌 ${post.tag}</span>
                        </div>
                        <div class="post-stats">
                            <div class="stat">👍 ${post.votes} votes</div>
                            <div class="stat">💬 ${post.comments} comments</div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.log('Error loading trending posts:', error);
                document.getElementById('trendingList').innerHTML = '<div class="empty-state"><p>Unable to load posts at this time.</p></div>';
            }
        }

        loadTrendingPosts();
    </script>
</body>
</html>
