<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orders</title><link rel="stylesheet" href="platform.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="disputes.html">Disputes</a></nav></header>
<main class="wrap"><section class="hero"><h1>Orders and escrow</h1><p class="muted">Track Flutterwave payment protection, delivery status, and disputes.</p></section><form id="orderForm" class="stack"><label>Item title<input name="title" required></label><label>Amount<input name="amount" type="number" min="0" required></label><label>Listing type<select name="listingType"><option>bookstore</option><option>marketplace</option></select></label><button>Create protected order</button><p data-status class="status"></p></form><section id="ordersList" class="grid" style="margin-top:18px"></section></main>
<script src="platform.js"></script><script>function load(){platform.loadCollection("/api/orders/items","#ordersList",(o)=>`<article class="card"><h3>${o.title}</h3><p>R${o.amount}</p><p><span class="badge">${o.paymentProvider}</span> <span class="badge">${o.escrowStatus}</span></p><p class="muted">${o.deliveryStatus}</p></article>`)} const pending=JSON.parse(localStorage.getItem("pendingOrder")||"null"); if(pending){document.querySelector('[name="title"]').value=pending.items.map(i=>i.title).join(", "); document.querySelector('[name="amount"]').value=pending.total || 0;} platform.bindForm("#orderForm","/api/orders/items",(f)=>Object.fromEntries(f),()=>{localStorage.removeItem("pendingOrder"); load();}); load();</script></body></html>
