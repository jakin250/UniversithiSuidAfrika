<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Book Listing</title><link rel="stylesheet" href="platform.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="bookstore.html">Bookstore</a><a href="dashboard.html">Dashboard</a></nav></header>
<main class="wrap"><section class="hero"><h1>Sell or exchange a textbook</h1><p class="muted">Add title, course, condition, quantity, price or exchange details, and image links.</p></section><form id="bookForm" class="stack"><label>Book title<input name="title" required></label><label>Author<input name="author" required></label><label>ISBN<input name="isbn"></label><label>Course or category<input name="category" required></label><label>Condition<select name="condition"><option value="new">New</option><option value="like-new">Like New</option><option value="good" selected>Good</option><option value="fair">Fair</option></select></label><label>Quantity<input name="quantity" type="number" min="1" value="1"></label><label>Listing type<select name="listingType"><option value="sale">Sale</option><option value="exchange">Exchange</option></select></label><label>Price<input name="price" type="number" min="0" step="1" value="0"></label><label>Description<textarea name="description"></textarea></label><label>Image URL<input name="imageUrl" placeholder="Front/back/damage photo link"></label><button>Publish textbook</button><p data-status class="status"></p></form></main>
<script src="platform.js"></script><script>platform.bindForm("#bookForm","/api/bookstore/listings",(f)=>Object.fromEntries(f),()=>location.href="bookstore.html");</script></body></html>
