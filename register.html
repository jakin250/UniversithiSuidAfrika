<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Universithi SuidAfrika</title>
  <link rel="stylesheet" href="platform.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="login.html">Login</a><a href="dashboard.html">Dashboard</a></nav></header>
  <main class="wrap">
    <section class="hero"><h1>Create a verified student account</h1><p class="muted">Use a real student email. Your university is detected from your email domain.</p></section>
    <form id="registerForm" class="stack">
      <label>Full name<input name="name" required autocomplete="name"></label>
      <label>Student email<input name="email" type="email" required autocomplete="email" placeholder="name@unisa.ac.za"></label>
      <label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Confirm password<input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
      <label><span><input name="terms" type="checkbox" required style="width:auto"> I agree to use the platform respectfully and honestly.</span></label>
      <button type="submit">Create account</button>
      <p data-status class="status"></p>
    </form>
  </main>
  <script src="platform.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      if (form.get("password") !== form.get("confirm")) return platform.setStatus("Passwords do not match.", false);
      try {
        const out = await platform.api("/api/auth/register", "POST", {
          name: form.get("name"),
          email: form.get("email"),
          password: form.get("password"),
        });
        localStorage.setItem("sessionToken", out.token);
        location.href = "dashboard.html";
      } catch (error) {
        platform.setStatus(error.message, false);
      }
    });
  </script>
</body>
</html>
