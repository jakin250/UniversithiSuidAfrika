<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Marketplace Listing</title><link rel="stylesheet" href="platform.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="studentmarketplace.html">Marketplace</a><a href="dashboard.html">Dashboard</a></nav></header>
<main class="wrap"><section class="hero"><h1>Post a marketplace ad</h1><p class="muted">Sell personal belongings or offer an exchange to verified students.</p></section><form id="listingForm" class="stack"><label>Product name<input name="title" required></label><label>Category<select name="category"><option>Textbooks</option><option>Electronics</option><option>Accommodation</option><option>Furniture</option><option>Transport</option><option>Services</option><option>Clothing</option><option>Other</option></select></label><label>Condition<select name="condition"><option>New</option><option>Like New</option><option>Good</option><option>Fair</option></select></label><label>Quantity<input name="quantity" type="number" min="1" value="1"></label><label>Price<input name="price" type="number" min="0" step="1" required></label><label>Location<input name="location" placeholder="Campus or city"></label><label>Description<textarea name="description"></textarea></label><label>Image URL<input name="imageUrl" placeholder="Required in production"></label><button>Publish ad</button><p data-status class="status"></p></form></main>
<script src="platform.js"></script><script>platform.bindForm("#listingForm","/api/marketplace/listings",(f)=>Object.fromEntries(f),()=>location.href="studentmarketplace.html");</script></body></html>
