<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Student Secondhand Bookstore</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f7f9fc;color:#1a2a3a;margin:0}
    .container{max-width:1100px;margin:0 auto;padding:24px}
    .layout{display:grid;grid-template-columns:300px 1fr;gap:20px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
    .sidebar{padding:16px}
    .thread{padding:16px;display:flex;flex-direction:column;min-height:70vh}
    .list-item{padding:12px;border-bottom:1px solid #eef2f7;cursor:pointer}
    .list-item.active{background:#eef2ff}
    .messages{flex:1;overflow:auto;padding:10px 0;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:72%;padding:10px 14px;border-radius:16px}
    .me{margin-left:auto;background:#4f46e5;color:#fff}
    .them{background:#f3f4f6}
    .composer{display:flex;gap:8px;margin-top:12px}
    textarea,input{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:10px}
    button{border:0;border-radius:12px;padding:10px 14px;background:#4f46e5;color:#fff;cursor:pointer}
    .muted{color:#64748b;font-size:.9rem}
  </style>
</head>
<body>
<div class="container">
  <h1>Bookstore Chat</h1>
  <p class="muted">Chats are now tied to real orders and saved in the backend.</p>
  <div class="layout">
    <div class="card sidebar">
      <div id="conversationList"></div>
    </div>
    <div class="card thread">
      <div id="threadHeader"></div>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="messageInput" rows="2" placeholder="Type a message..."></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>
  <script src="../public/api-client.js"></script>
  <script>
  const params = new URLSearchParams(location.search);
  let conversations = [];
  let activeId = params.get('order') || null;

  function formatTime(value){ return new Date(value).toLocaleString('en-ZA', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'}); }

  function renderList(){
    const list = document.getElementById('conversationList');
    if(!conversations.length){ list.innerHTML = '<div class="muted">No bookstore conversations yet.</div>'; return; }
    list.innerHTML = conversations.map(conv => `
      <div class="list-item ${String(conv.id)===String(activeId) ? 'active' : ''}" data-id="${conv.id}">
        <div><strong>${conv.book.title}</strong></div>
        <div class="muted">${conv.withUser.name}</div>
        <div class="muted">${conv.lastMessage || 'No messages yet'}</div>
      </div>
    `).join('');
    list.querySelectorAll('.list-item').forEach(item => item.addEventListener('click', () => { activeId = item.dataset.id; render(); }));
  }

  function renderThread(){
    const conv = conversations.find(c => String(c.id)===String(activeId));
    const header = document.getElementById('threadHeader');
    const messages = document.getElementById('messages');
    if(!conv){
      header.innerHTML = '<h2>Select an order</h2><p class="muted">Open a real order to continue the conversation.</p>';
      messages.innerHTML = '';
      return;
    }
    header.innerHTML = `<h2>${conv.book.title}</h2><div class="muted">Seller: ${conv.withUser.name} • Order #${conv.id}</div>`;
    messages.innerHTML = conv.messages.map(msg => `<div class="msg ${msg.sender === 'me' ? 'me' : 'them'}">${msg.text}<div class="muted" style="margin-top:4px">${formatTime(msg.timestamp)}</div></div>`).join('');
    messages.scrollTop = messages.scrollHeight;
  }

  async function loadData(){
    const inbox = await apiClient.get('../api/bookstore/inbox');
    conversations = inbox.map(thread => ({
      id: thread.id,
      orderId: thread.orderId || null,
      bookId: thread.bookId || null,
      book: thread.book || { title: 'Book', cover: '📘' },
      withUser: thread.withUser || { name: 'Seller' },
      lastMessage: thread.lastMessage || '',
      messages: (thread.messages || []).map(message => ({
        sender: message.sender || 'them',
        text: message.text || '',
        timestamp: message.timestamp || new Date().toISOString()
      }))
    }));
    if(!activeId && conversations[0]) activeId = conversations[0].id;
    renderList(); renderThread();
  }

  document.getElementById('sendBtn').addEventListener('click', async () => {
    const conv = conversations.find(c => String(c.id)===String(activeId));
    const text = document.getElementById('messageInput').value.trim();
    if(!conv || !text) return;
    await apiClient.post('../api/bookstore/messages', {
      orderId: conv.orderId || conv.id,
      bookId: conv.book.id || null,
      text
    });
    document.getElementById('messageInput').value = '';
    await loadData();
  });

  loadData().catch(err => {
    console.error(err);
    document.getElementById('conversationList').innerHTML = '<div class="muted">Could not load messages.</div>';
  });
</script>
</body>
</html>
