<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account Settings</title><link rel="stylesheet" href="platform.css"></head>
<body>
  <header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="profile.html">Profile</a><a href="dashboard.html">Dashboard</a></nav></header>
  <main class="wrap">
    <section class="hero"><h1>Account settings</h1><p class="muted">Manage password, email preferences, and payment details.</p></section>
    <form class="stack" onsubmit="event.preventDefault(); platform.setStatus('Settings saved locally. Connect account settings API for permanent updates.');">
      <label>Notification email<input type="email" placeholder="student@unisa.ac.za"></label>
      <label>Flutterwave payout reference<input placeholder="Bank or payout profile"></label>
      <label>Email preferences<select><option>All updates</option><option>Only messages and orders</option><option>Critical security only</option></select></label>
      <button>Save settings</button><p data-status class="status"></p>
    </form>
  </main>
  <script src="platform.js"></script>
</body>
</html>
