<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Note Detail</title><link rel="stylesheet" href="platform.css"></head>
<body>
  <header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="notes.html">Notes</a><a href="upload-notes.html">Upload</a></nav></header>
  <main class="wrap"><section id="note" class="panel"></section></main>
  <script src="platform.js"></script>
  <script>
    (async()=>{const id=new URLSearchParams(location.search).get("id"); const out=await platform.api("/api/notes/items"); const n=(out.items||[]).find(x=>String(x.id)===String(id)); note.innerHTML=n?`<span class="badge">${n.course}</span><h1>${n.title}</h1><p class="muted">${n.module||""} ${n.chapter||""}</p><p>${n.content.replaceAll("\n","<br>")}</p>${n.fileUrl?`<p><a class="button" href="${n.fileUrl}">Open file</a></p>`:""}<p class="muted">Rating: ${n.rating || 0} / 5</p>`:`<p class="muted">Note not found.</p>`})()
  </script>
</body>
</html>
