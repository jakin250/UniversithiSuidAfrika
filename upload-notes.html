<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Upload Notes</title><link rel="stylesheet" href="platform.css"></head>
<body>
  <header class="topbar"><a class="brand" href="index.html">Universithi SuidAfrika</a><nav class="nav"><a href="notes.html">Notes</a><a href="dashboard.html">Dashboard</a></nav></header>
  <main class="wrap">
    <section class="hero"><h1>Upload study notes</h1><p class="muted">Add structured academic content by course, module, and chapter.</p></section>
    <form id="noteForm" class="stack"><label>Title<input name="title" required></label><label>Course<input name="course" required></label><label>Module<input name="module"></label><label>Chapter<input name="chapter"></label><label>Type<select name="noteType"><option>Study notes</option><option>Chapter summary</option><option>Full module</option><option>Exam revision</option></select></label><label>Note text<textarea name="content" required></textarea></label><label>File link<input name="fileUrl" placeholder="Optional Cloudinary, Drive, or PDF URL"></label><button>Publish notes</button><p data-status class="status"></p></form>
  </main>
  <script src="platform.js"></script>
  <script>platform.bindForm("#noteForm","/api/notes/items",(f)=>Object.fromEntries(f),()=>location.href="notes.html");</script>
</body>
</html>
