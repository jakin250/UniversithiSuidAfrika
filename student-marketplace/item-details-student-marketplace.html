<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Item Details | Student Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #f9fafb; }
  </style>
</head>
<body>
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="window.location.href='student-marketplace-buy-sell-trade-on-campus.html'">
        <i class="fas fa-graduation-cap text-indigo-600 text-2xl"></i>
        <span class="font-bold text-xl text-gray-800">Student<span class="text-indigo-600">Marketplace</span></span>
      </div>
      <div class="hidden md:flex items-center space-x-8">
        <a href="browse-listings-student-marketplace.html" class="text-gray-700 hover:text-indigo-600 font-medium">Browse</a>
        <a href="create-listing-student-marketplace.html" class="text-gray-700 hover:text-indigo-600 font-medium">Sell</a>
        <a href="messages-student-marketplace.html" class="text-gray-700 hover:text-indigo-600 font-medium"><i class="far fa-comment-dots mr-1"></i>Messages</a>
        <a href="my-dashboard-student-marketplace.html" class="text-gray-700 hover:text-indigo-600 font-medium">Dashboard</a>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
  <div class="text-sm text-gray-500 mb-6">
    <a href="browse-listings-student-marketplace.html" class="hover:text-indigo-600">Browse</a> / <span id="breadcrumbTitle" class="text-gray-800">Item</span>
  </div>

  <div class="grid lg:grid-cols-2 gap-8">
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
      <div class="h-96 bg-gray-100 rounded-2xl flex items-center justify-center">
        <i class="fas fa-box-open text-5xl text-gray-400"></i>
      </div>
    </div>
    <div>
      <h1 id="itemTitle" class="text-3xl font-bold text-gray-900">Loading...</h1>
      <p id="itemMeta" class="mt-3 text-sm text-gray-500"></p>
      <div class="mt-5 text-4xl font-bold text-indigo-600" id="itemPrice">$0</div>
      <p id="itemDescription" class="mt-5 text-gray-700 leading-relaxed"></p>
      <div class="mt-6 flex flex-wrap gap-3">
        <button id="chatSellerBtn" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-semibold">Chat seller</button>
        <button id="offerBtn" class="border border-indigo-200 bg-indigo-50 text-indigo-700 px-5 py-3 rounded-xl font-semibold">Make offer</button>
        <button id="buyNowBtn" class="border border-gray-300 bg-white px-5 py-3 rounded-xl font-semibold">Buy now</button>
        <button id="saveBtn" class="border border-pink-200 bg-pink-50 text-pink-700 px-5 py-3 rounded-xl font-semibold">Save item</button>
      </div>
      <div class="mt-6 bg-indigo-50 border border-indigo-100 rounded-2xl p-4 text-sm text-indigo-900">
        Payment is held in escrow until the buyer confirms delivery.
      </div>
    </div>
  </div>
</main>

<script src="../public/api-client.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const listingId = params.get('id');
  let currentListing = null;

  async function loadListing() {
    const listings = await apiClient.get('../api/marketplace/listings');
    currentListing = listings.find(item => String(item.id) === String(listingId)) || null;
    if (!currentListing) {
      document.getElementById('itemTitle').innerText = 'No listing found';
      document.getElementById('itemMeta').innerText = 'This item may have been removed or never existed.';
      document.getElementById('itemDescription').innerText = '';
      document.getElementById('chatSellerBtn').disabled = true;
      document.getElementById('offerBtn').disabled = true;
      document.getElementById('buyNowBtn').disabled = true;
      return;
    }
    document.getElementById('breadcrumbTitle').innerText = currentListing.title;
    document.getElementById('itemTitle').innerText = currentListing.title;
    document.getElementById('itemMeta').innerText = `${currentListing.category || 'Listing'} • ${currentListing.condition || 'Unknown condition'} • ${currentListing.seller || 'Campus seller'}`;
    document.getElementById('itemPrice').innerText = `$${Number(currentListing.price || 0).toFixed(0)}`;
    document.getElementById('itemDescription').innerText = currentListing.description || 'No description provided yet.';
  }

  document.getElementById('chatSellerBtn').addEventListener('click', async () => {
    if (!currentListing) return;
    await apiClient.post('../api/marketplace/messages', {
      listingId: currentListing.id,
      itemTitle: currentListing.title,
      itemPrice: currentListing.price,
      sellerName: currentListing.seller || 'Seller',
      sellerInitials: (currentListing.seller || 'SS').split(' ').map(part => part[0]).join('').slice(0, 2).toUpperCase(),
      text: 'Hi, I would like to chat about this item.',
      amount: currentListing.price
    });
    window.location.href = 'messages-student-marketplace.html';
  });

  document.getElementById('offerBtn').addEventListener('click', async () => {
    const amount = prompt('Enter your offer amount');
    if (!amount || Number.isNaN(Number(amount))) return;
    await apiClient.post('../api/marketplace/offers', {
      listingId: currentListing?.id,
      amount: Number(amount),
      message: 'Offer from the item details page'
    });
    alert('Offer sent to the seller.');
  });

  document.getElementById('buyNowBtn').addEventListener('click', () => {
    window.location.href = `secure-checkout-student-marketplace.html?listingId=${currentListing?.id || ''}`;
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    if (!currentListing) return;
    await apiClient.post('../api/marketplace/saves', { listingId: currentListing.id });
    alert('Item saved.');
  });

  loadListing().catch(error => {
    console.error(error);
    document.getElementById('itemTitle').innerText = 'Could not load listing';
  });
</script>
</body>
</html>
